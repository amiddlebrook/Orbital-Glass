name: Verify and deploy to Cloudflare

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbital-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build production frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-glass-static
          path: dist/
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in repository Actions secrets"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in repository Actions secrets"; exit 1; }
      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test deployed Worker and frontend
        env:
          SITE: https://orbital-glass.averymiddlebrook2014.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 12 \
              "$SITE/api/health" -o health.json \
              && node -e "const r=require('./health.json'); if(r.status !== 'ok' || r.runtime !== 'cloudflare-workers') process.exit(1)" \
              && curl --fail --silent --show-error --max-time 12 "$SITE/" -o homepage.html \
              && grep -q 'Orbital Glass | Edge Control Room' homepage.html; then
              echo "Production smoke test passed at $SITE"
              cat health.json
              exit 0
            fi
            echo "Production endpoint not ready (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::Production frontend or Worker health endpoint failed verification"
          exit 1
